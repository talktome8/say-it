<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/say-it/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="ממיר טקסט לדיבור מתקדם התומך במגוון שפות">
    <meta name="keywords" content="text to speech, טקסט לדיבור, עברית, אנגלית, ערבית, רוסית, צרפתית, גרמנית">
    <title>Say It - טקסט לדיבור</title>
    <style>
      .loading-screen {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        position: fixed;
        top: 0;
        left: 0;
        background-color: #fff;
        z-index: 9999;
        transition: opacity 0.5s;
      }
      .loading-screen.loaded {
        opacity: 0;
        pointer-events: none;
      }
      .loading-indicator {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #42b983;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .loading-text {
        margin-top: 20px;
        font-family: 'Segoe UI', Arial, sans-serif;
      }
      .error-message {
        color: #e74c3c;
        padding: 20px;
        max-width: 80%;
        text-align: center;
        background-color: #fef2f2;
        border-radius: 8px;
        font-family: 'Segoe UI', Arial, sans-serif;
        margin-top: 20px;
        display: none;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      /* Preload basic styles to prevent FOUC */
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background-color: #fafafa;
        margin: 0;
        padding: 0;
      }
    </style>
    <script type="module" crossorigin src="/say-it/assets/index-DxlcgVep.js"></script>
    <link rel="stylesheet" crossorigin href="/say-it/assets/index-BOoSm_Aw.css">
  </head>
  <body>
    <div id="app"></div>
    
    <div class="loading-screen" id="loading-screen">
      <div class="loading-indicator"></div>
      <div class="loading-text">טוען את האפליקציה...</div>
      <div class="error-message" id="error-message">
        אירעה שגיאה בטעינת האפליקציה. מנסה להפעיל מצב מופחת.
      </div>
    </div>

    <script>
      // Safety timeout - if app doesn't load in 10 seconds, show error
      const loadTimeout = setTimeout(() => {
        document.getElementById('error-message').style.display = 'block';
      }, 10000);

      // Error handling to prevent complete failure
      window.addEventListener('error', function(event) {
        console.error('App error:', event.error);
        document.getElementById('error-message').style.display = 'block';
      });

      // Mark app as loaded when it's ready
      window.appLoaded = function() {
        clearTimeout(loadTimeout);
        document.getElementById('loading-screen').classList.add('loaded');
        // Remove after transition completes
        setTimeout(() => {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen && loadingScreen.parentNode) {
            loadingScreen.parentNode.removeChild(loadingScreen);
          }
        }, 500);
      };

      // Fallback if app doesn't call appLoaded
      window.addEventListener('load', function() {
        setTimeout(() => {
          window.appLoaded();
        }, 2000);
      });
    </script>
    
  </body>
</html>
